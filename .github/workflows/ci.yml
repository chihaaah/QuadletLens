name: Test and build
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  quadlet:
    name: Quadlet / Fedora 44 / Podman 5.8.7
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @compose2quadlet/core
      - name: Install Fedora RPM userspace and run the real generator
        run: bash tests/integration/fedora-ci.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quadlet-fedora44-output
          path: quadlet-report
          if-no-files-found: warn
