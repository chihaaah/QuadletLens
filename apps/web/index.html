<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f2" />
    <script>
      // Resolve preferences before first paint; Compose content is never stored.
      const readPreference = (key, allowed) => {
        try {
          const value = localStorage.getItem(`quadletlens.${key}`);
          if (allowed.includes(value)) return value;
          // Legacy keys are read only on this origin; never transfer user data.
          const legacy = localStorage.getItem(`compose2quadlet.${key}`);
          return allowed.includes(legacy) ? legacy : undefined;
        } catch {
          return undefined;
        }
      };
      const theme = readPreference("theme", ["light", "dark"]);
      const language = readPreference("language", ["en", "ja"]);
      document.documentElement.dataset.theme =
        theme === "light" || theme === "dark"
          ? theme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.lang =
        language === "en" || language === "ja"
          ? language
          : /^ja(?:-|$)/i.test(navigator.language)
            ? "ja"
            : "en";
    </script>
    <meta
      name="description"
      content="A browser-local migration analyzer for Docker Compose to Podman Quadlet."
    />
    <title>QuadletLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
